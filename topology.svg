<svg width="100%" viewBox="0 0 680 445" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Internet -->
  <rect x="250" y="15" width="180" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="35" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Internet</text>

  <!-- Arrow: Internet → Gateway -->
  <line x1="340" y1="55" x2="340" y2="78" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="250" y="80" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Gateway</text>
  <text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">192.168.0.1</text>

  <!-- Arrow: Gateway → Host -->
  <line x1="340" y1="136" x2="340" y2="170" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="153" dominant-baseline="central" font-size="12" fill="#5F5E5A">NAT / Bridged</text>

  <!-- Host container -->
  <rect x="50" y="172" width="580" height="253" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="6 3"/>
  <text x="70" y="193" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Host — Windows + VirtualBox</text>

  <!-- VirtualBox container -->
  <rect x="70" y="208" width="540" height="192" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="90" y="224" dominant-baseline="central" font-size="12" fill="#3C3489">VirtualBox hypervisor</text>

  <!-- DC01 -->
  <rect x="90" y="240" width="220" height="140" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="200" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">DC01</text>
  <text x="200" y="282" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Win Server 2019 Core</text>
  <text x="200" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">192.168.0.10 (static)</text>
  <text x="200" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Domain Controller</text>
  <text x="200" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">AD · DNS · DHCP · GPO</text>
  <text x="200" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">homelab.local</text>

  <!-- linux-srv -->
  <rect x="360" y="240" width="220" height="140" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="262" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">linux-srv</text>
  <text x="470" y="282" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Ubuntu 22.04 LTS</text>
  <text x="470" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">DHCP: 192.168.0.100</text>
  <text x="470" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">SSH Ed25519</text>
  <text x="470" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Domain member</text>
  <text x="470" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">homelab.local</text>
</svg>
